<html>
<head>
    <title>API Insights</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        th {
            background: #4CAF50;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .slow {
            color: red;
            font-weight: bold;
        }

        .toggle-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .toggle-on {
            background: #4CAF50;
            color: white;
        }

        .toggle-off {
            background: #9e9e9e;
            color: white;
        }
    </style>
</head>
<body>

<h1 style="display:inline;">API Insights Dashboard</h1>
<button onclick="clearLogs()"
        style="margin-left: 20px;
                   padding: 8px 16px;
                   background: #e53935;
                   color: white;
                   border: none;
                   border-radius: 4px;
                   cursor: pointer;
                   font-size: 14px;">
    Clear Logs
</button>

<button id="autoRefreshBtn" class="toggle-btn toggle-on" onclick="toggleAutoRefresh()">
    Auto Refresh: ON
</button>

<h2 style="margin-top: 30px; color: #333;">Summary</h2>
<table>
    <thead>
    <tr>
        <th>Endpoint</th>
        <th>Total Calls</th>
        <th>Avg Duration</th>
        <th>Slowest</th>
        <th>Total Queries</th>
        <th>N+1 Suspected</th>
        <th>Performance Issue</th>
    </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<h2 style="margin-top: 40px; color: #333;">Recent API Logs</h2>
<table>
    <thead>
    <tr>
        <th>Endpoint</th>
        <th>Method</th>
        <th>Status</th>
        <th>Duration</th>
        <th>Queries</th>
        <th>N+1</th>
        <th>Performance issue</th>
        <th>Time</th>

    </tr>
    </thead>
    <tbody id="logsBody"></tbody>
</table>

<script>
    let autoRefreshEnabled = true;
    let refreshIntervalId = null;

    async function loadData() {
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('logsBody').innerHTML = '';

        const summaryRes = await fetch('/insights/summary');
        const summary = await summaryRes.json();
        const tableBody = document.getElementById('tableBody');

        Object.entries(summary).forEach(([endpoint, stats]) => {
            const avgMs = parseInt(stats.Average);
            const isSlow = avgMs > 500;

            const row = `
                <tr>
                    <td>${endpoint}</td>
                    <td>${stats.Count}</td>
                    <td class="${isSlow ? 'slow' : ''}">${stats.Average}</td>
                    <td class="${isSlow ? 'slow' : ''}">${stats.Slowest}</td>
                    <td>${stats.QueriesFired}</td>
                    <td>${stats["isN+1 Suspected"]}</td>
                    <td>${stats.PerformanceWarning}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        const logsRes = await fetch('/insights');
        const logs = await logsRes.json();
        const logsBody = document.getElementById('logsBody');

        logs.reverse().forEach(log => {
            const time = new Date(log.timeStamp).toLocaleTimeString();

            const row = `
                <tr>
                    <td>${log.api}</td>
                    <td>${log.method}</td>
                    <td>${log.statusCode}</td>
                    <td>${log.duration}ms</td>
                    <td>${log.queryCount}</td>
                    <td>${log.suspectedN1 ? "YES" : "NO"}</td>
                    <td>${log.performanceWarning ? "YES" : "NO"}</td>
                    <td>${time}</td>
                </tr>
            `;
            logsBody.innerHTML += row;
        });
    }

    async function clearLogs() {
        await fetch('/insights/clear', { method: 'DELETE' });
        loadData();
    }

    function startAutoRefresh() {
        if (refreshIntervalId === null) {
            refreshIntervalId = setInterval(loadData, 5000);
        }
    }

    function stopAutoRefresh() {
        if (refreshIntervalId !== null) {
            clearInterval(refreshIntervalId);
            refreshIntervalId = null;
        }
    }

    function toggleAutoRefresh() {
        autoRefreshEnabled = !autoRefreshEnabled;
        const btn = document.getElementById('autoRefreshBtn');

        if (autoRefreshEnabled) {
            btn.textContent = 'Auto Refresh: ON';
            btn.classList.remove('toggle-off');
            btn.classList.add('toggle-on');
            startAutoRefresh();
        } else {
            btn.textContent = 'Auto Refresh: OFF';
            btn.classList.remove('toggle-on');
            btn.classList.add('toggle-off');
            stopAutoRefresh();
        }
    }

    loadData();

    // auto refresh is ON by default
    startAutoRefresh();
</script>

</body>
</html>
